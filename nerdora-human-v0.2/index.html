<body>
<div id="app"><div id="view"></div><div class="shade"></div>
<header><div class="logo">N</div><div class="brand"><b>Nerdora Human</b><span>Explore o corpo humano • v0.2 Real Anatomy</span></div><button class="round" id="home">⌂</button><button class="round" id="reset">↻</button></header>
<div class="tools"><button class="tool" id="front" title="Vista frontal">◉</button><button class="tool" id="back" title="Vista posterior">↺</button></div>
<div class="opacity"><input id="opacity" type="range" min="0" max="100" value="100"></div>
<div class="credit">Anatomia aberta<br>Z‑Anatomy + BodyParts3D</div>
<div class="status" id="status"><div class="spin"></div><div style="flex:1"><b id="stitle">Preparando Nerdora Human</b><small id="stext">Carregando corpo humano realista…</small><div class="bar"><i id="prog"></i></div></div></div>
<div class="hint"><b>Arraste</b> para girar • <b>pinça</b> para zoom • toque em uma estrutura</div>
<div class="panel" id="panel"><div class="head"><div class="ico" id="pico">🧍</div><div class="text"><h2 id="pname">Estrutura anatômica</h2><small id="psys">Sistema</small></div><button class="x" id="close">×</button></div><div class="desc" id="pdesc"></div><div class="actions"><button class="primary" id="focus">FOCAR</button><button id="hide">OCULTAR</button></div></div>
<div class="err" id="err"><b>Falha ao carregar a anatomia 3D.</b><div id="errmsg" style="font-size:12px;margin-top:6px"></div><button id="retry">Tentar novamente</button></div>
<div class="layers">

<button class="layer" data-id="muscular"><em>💪</em>Músculos</button>
<button class="layer" data-id="visceral"><em>🫀</em>Órgãos</button>
<button class="layer" data-id="skeletal"><em>🦴</em>Ossos</button>
<button class="layer" data-id="cardiovascular"><em>❤️</em>Vasos</button>
<button class="layer" data-id="nervous"><em>🧠</em>Nervos</button>
<button class="layer" data-id="lymphatic"><em>🫧</em>Linfático</button>
</div></div>
<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";
import {GLTFLoader} from "three/addons/loaders/GLTFLoader.js";
import {DRACOLoader} from "three/addons/loaders/DRACOLoader.js";

const U={
skin:"https://cdn.jsdelivr.net/gh/yamz8/human-body-simulator@main/public/models/anatomy-skin.glb",
muscular:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/muscular.glb",
visceral:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/visceral.glb",
skeletal:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/skeletal.glb",
cardiovascular:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/cardiovascular.glb",
nervous:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/nervous.glb",
lymphatic:"https://cdn.jsdelivr.net/gh/nqwrc/3d-anatomy@master/public/models/lymphatic.glb"};
const M={skin:["Exterior","🧍"],muscular:["Sistema muscular","💪"],visceral:["Órgãos internos","🫀"],skeletal:["Sistema esquelético","🦴"],cardiovascular:["Sistema cardiovascular","❤️"],nervous:["Sistema nervoso","🧠"],lymphatic:["Sistema linfático","🫧"]};
const D={skin:"A pele forma o revestimento externo do corpo. Diminua a transparência para revelar as estruturas internas.",muscular:"Os músculos produzem movimento, estabilizam articulações e ajudam a manter a postura.",visceral:"Aqui ficam os principais órgãos internos do tórax, abdômen e pelve.",skeletal:"O esqueleto sustenta o corpo, protege órgãos e trabalha com os músculos para produzir movimento.",cardiovascular:"Coração e vasos transportam sangue, oxigênio e nutrientes por todo o organismo.",nervous:"Cérebro, medula e nervos recebem, processam e transmitem sinais pelo corpo.",lymphatic:"O sistema linfático participa da defesa do organismo e da drenagem dos líquidos dos tecidos."};
const T={"heart":"Coração","brain":"Cérebro","lung":"Pulmão","liver":"Fígado","kidney":"Rim","stomach":"Estômago","pancreas":"Pâncreas","spleen":"Baço","femur":"Fêmur","humerus":"Úmero","radius":"Rádio","ulna":"Ulna","tibia":"Tíbia","fibula":"Fíbula","patella":"Patela","clavicle":"Clavícula","scapula":"Escápula","sternum":"Esterno","mandible":"Mandíbula","aorta":"Aorta","trachea":"Traqueia","bladder":"Bexiga","cochlea":"Cóclea","skin":"Pele"};
const $=x=>document.getElementById(x), loaded=new Map(), inflight=new Map(), pick=[];
let scene,camera,renderer,controls,ray,pointer,current="skin",selected=null,skinOpacity=1,start=null,highlighted=null;
function nameOf(raw){raw=(raw||"Estrutura anatômica").replace(/\.(l|r)$/i,"").replace(/_/g," ");let low=raw.toLowerCase();for(const k in T){if(low===k||low.indexOf(k+" ")===0||low.indexOf(" "+k+" ")>=0)return raw.replace(new RegExp(k,"i"),T[k])}return raw}
function init(){scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x050712,.038);camera=new THREE.PerspectiveCamera(31,innerWidth/innerHeight,.01,100);camera.position.set(0,.1,8.6);renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:"high-performance"});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;$("view").appendChild(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.07;controls.minDistance=2.2;controls.maxDistance=14;controls.target.set(0,0,0);scene.add(new THREE.HemisphereLight(0xc7d1ff,0x25151d,2.3));let a=new THREE.DirectionalLight(0xffffff,3);a.position.set(4,5,6);scene.add(a);let b=new THREE.DirectionalLight(0x856dff,1.8);b.position.set(-5,2,3);scene.add(b);let c=new THREE.DirectionalLight(0x4eaaff,1.6);c.position.set(2,2,-5);scene.add(c);let floor=new THREE.Mesh(new THREE.CircleGeometry(2.2,64),new THREE.MeshBasicMaterial({color:0x11162a,transparent:true,opacity:.45}));floor.rotation.x=-Math.PI/2;floor.position.y=-3.15;scene.add(floor);ray=new THREE.Raycaster();pointer=new THREE.Vector2();renderer.domElement.addEventListener("pointerdown",e=>start=[e.clientX,e.clientY]);renderer.domElement.addEventListener("pointerup",pickAt);addEventListener("resize",resize);loop()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}
function status(title,text,p){$("status").style.display="flex";$("stitle").textContent=title;$("stext").textContent=text;$("prog").style.width=(p||10)+"%"}
function noStatus(){$("status").style.display="none"}
function btn(id){return document.querySelector('.layer[data-id="'+id+'"]')}
function prep(root,id){let box=new THREE.Box3().setFromObject(root),size=box.getSize(new THREE.Vector3()),center=box.getCenter(new THREE.Vector3()),s=6.02/Math.max(size.y,.001);root.scale.setScalar(s);root.position.set(-center.x*s,-center.y*s,-center.z*s);root.visible=false;root.userData.system=id;root.traverse(o=>{if(!o.isMesh)return;o.userData.system=id;o.userData.label=nameOf(o.userData.za_name||o.name||M[id][0]);pick.push(o);if(id==="skin"){o.material=new THREE.MeshPhysicalMaterial({color:0xc98274,roughness:.57,clearcoat:.09,sheen:.22,sheenColor:new THREE.Color(0xf2b2a8),transparent:true,opacity:skinOpacity,depthWrite:true});o.renderOrder=10}});scene.add(root);return root}
async function load(id){if(loaded.has(id))return loaded.get(id);if(inflight.has(id))return inflight.get(id);btn(id).classList.add("loading");let p=new Promise((resolve,reject)=>{let draco=new DRACOLoader();draco.setDecoderPath("https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/libs/draco/");draco.setWorkerLimit(2);let l=new GLTFLoader();l.setDRACOLoader(draco);status("Carregando "+M[id][0],id==="skin"?"Preparando o corpo externo…":"Baixando anatomia detalhada…",10);l.load(U[id],g=>{let r=prep(g.scene,id);loaded.set(id,r);inflight.delete(id);btn(id).classList.remove("loading");draco.dispose();resolve(r)},x=>{if(x.total){let q=x.loaded/x.total*100;$("prog").style.width=q+"%";$("stext").textContent=(x.loaded/1048576).toFixed(1)+" de "+(x.total/1048576).toFixed(1)+" MB"}else $("stext").textContent=(x.loaded/1048576).toFixed(1)+" MB recebidos…"},e=>{inflight.delete(id);btn(id).classList.remove("loading");draco.dispose();reject(e)})});inflight.set(id,p);return p}
function skin(op){let r=loaded.get("skin");if(!r)return;r.traverse(o=>{if(o.isMesh){o.material.opacity=op;o.material.transparent=op<.99;o.material.depthWrite=op>.7}});r.visible=op>.004}
async function show(id){current=id;document.querySelectorAll(".layer").forEach(x=>x.classList.toggle("active",x.dataset.id===id));closePanel();try{await load(id);loaded.forEach((r,k)=>{r.visible=k===id||(k==="skin"&&id!=="skin"&&skinOpacity>0)});skin(id==="skin"?skinOpacity:Math.min(skinOpacity,.085));noStatus();fit()}catch(e){noStatus();$("errmsg").textContent="A camada "+M[id][0]+" não carregou. Confirme que o celular está conectado à internet.";$("err").style.display="block"}}
function fit(){let r=loaded.get(current)||loaded.get("skin");if(!r)return;controls.target.set(0,0,0);camera.position.set(0,.08,8.1);controls.update()}
function pickAt(e){if(!start)return;let dx=e.clientX-start[0],dy=e.clientY-start[1];start=null;if(Math.hypot(dx,dy)>10)return;let rr=renderer.domElement.getBoundingClientRect();pointer.x=(e.clientX-rr.left)/rr.width*2-1;pointer.y=-(e.clientY-rr.top)/rr.height*2+1;ray.setFromCamera(pointer,camera);let h=ray.intersectObjects(pick.filter(o=>o.visible),false)[0];if(h)select(h.object)}
function select(o){selected=o;let id=o.userData.system||current;$("pname").textContent=o.userData.label||nameOf(o.name);$("psys").textContent=M[id][0];$("pico").textContent=M[id][1];$("pdesc").textContent=D[id];$("panel").classList.add("open");if(highlighted&&highlighted.userData.oldMat){highlighted.material=highlighted.userData.oldMat;delete highlighted.userData.oldMat}highlighted=o;if(o.material){o.userData.oldMat=o.material;let m=o.material.clone();if(m.emissive){m.emissive=new THREE.Color(0x6d35ff);m.emissiveIntensity=.45}else if(m.color)m.color.lerp(new THREE.Color(0xa778ff),.35);o.material=m}}
function closePanel(){$("panel").classList.remove("open")}
function focus(){if(!selected)return;let box=new THREE.Box3().setFromObject(selected),c=box.getCenter(new THREE.Vector3()),s=box.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z,.12);let dir=camera.position.clone().sub(controls.target).normalize();controls.target.copy(c);camera.position.copy(c).add(dir.multiplyScalar(Math.max(r*4,.75)));controls.update()}
document.querySelectorAll(".layer").forEach(x=>x.onclick=()=>show(x.dataset.id));
$("opacity").oninput=e=>{skinOpacity=e.target.value/100;skin(current==="skin"?skinOpacity:Math.min(skinOpacity,.085))};
$("reset").onclick=fit;$("home").onclick=()=>show("skin");$("front").onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,.08,8.1);controls.update()};$("back").onclick=()=>{controls.target.set(0,0,0);camera.position.set(0,.08,-8.1);controls.update()};$("close").onclick=closePanel;$("focus").onclick=focus;$("hide").onclick=()=>{if(selected){selected.visible=false;closePanel()}};$("retry").onclick=()=>{$("err").style.display="none";show(current)};
init();show("skin").then(()=>setTimeout(()=>load("skeletal").catch(()=>{}),800));
setTimeout(()=>{if(!loaded.has("skin")){$("errmsg").textContent="O modelo externo não respondeu. Abra este link no Chrome ou Firefox com internet ativa.";$("err").style.display="block"}},18000);
</script>
