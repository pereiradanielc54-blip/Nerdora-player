<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=8.0, user-scalable=yes" />
  <link rel="stylesheet" href="../docx_renderer/font-aliases.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #e9edf0;
      -webkit-text-size-adjust: 100%;
      font-family: Calibri, Carlito, Arial, sans-serif;
    }

    #app {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #e9edf0;
    }

    #viewport {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      box-sizing: border-box;
      padding: 12px 10px 18px;
    }

    body.has-tabs #viewport {
      bottom: 60px;
    }

    #sheetHost {
      width: 100%;
      min-height: 1px;
    }

    .sheet-wrapper {
      position: relative;
      margin: 0 auto 18px;
    }

    .sheet-stage {
      position: relative;
      display: grid;
      background: #ffffff;
      box-shadow: 0 2px 14px rgba(0,0,0,.18);
      transform-origin: top left;
      overflow: visible;
    }

    .cell {
      box-sizing: border-box;
      display: flex;
      min-width: 0;
      min-height: 0;
      padding: 1px 3px;
      color: #000;
      background: transparent;
      overflow: hidden;
      line-height: 1.18;
    }

    .cell-content {
      width: 100%;
      min-width: 0;
      min-height: 0;
      display: flex;
      align-items: inherit;
      justify-content: inherit;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: clip;
    }

    .cell.wrap .cell-content {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .cell.vertical-text .cell-content {
      writing-mode: vertical-rl;
      text-orientation: mixed;
    }

    #tabs {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      box-sizing: border-box;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 8px 10px 10px;
      overflow-x: auto;
      overflow-y: hidden;
      background: rgba(255,255,255,.98);
      border-top: 1px solid rgba(0,0,0,.10);
      box-shadow: 0 -2px 8px rgba(0,0,0,.06);
      scrollbar-width: none;
      z-index: 30;
    }

    #tabs::-webkit-scrollbar { display: none; }
    #tabs.visible { display: flex; }

    .tab {
      border: 0;
      border-radius: 999px;
      padding: 8px 14px;
      background: #e8eaed;
      color: #263238;
      font: inherit;
      font-size: 13px;
      white-space: nowrap;
    }

    .tab.active {
      background: #153f33;
      color: #fff;
      font-weight: 700;
    }

    #empty {
      display: none;
      margin: 22px auto;
      padding: 24px 20px;
      max-width: 420px;
      text-align: center;
      color: #455a64;
      font-size: 14px;
      background: #fff;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="viewport">
      <div id="sheetHost"></div>
      <div id="empty">Esta aba não possui conteúdo visível.</div>
    </div>
    <div id="tabs"></div>
  </div>

  <script src="officekit-viewer.js"></script>
  <script>
    (() => {
      function decodeBase64Chunks() {
        const total = NerdoraXlsx.getChunkCount();
        const parts = new Array(total);
        for (let i = 0; i < total; i++) parts[i] = NerdoraXlsx.getChunk(i);

        const raw = atob(parts.join(""));
        const bytes = new Uint8Array(raw.length);
        const stride = 32768;
        for (let start = 0; start < raw.length; start += stride) {
          const end = Math.min(start + stride, raw.length);
          for (let i = start; i < end; i++) bytes[i] = raw.charCodeAt(i);
        }
        return bytes;
      }

      async function start() {
        try {
          if (!window.NerdoraOfficeKit || typeof window.NerdoraOfficeKit.renderXlsx !== "function") {
            throw new Error("Novo motor Office Kit não carregou.");
          }

          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }

          await window.NerdoraOfficeKit.renderXlsx(decodeBase64Chunks());
        } catch (error) {
          console.error(error);
          NerdoraXlsx.onError(error && error.message ? error.message : String(error));
        }
      }

      window.addEventListener("load", start, { once: true });
    })();
  </script>
</body>
</html>
