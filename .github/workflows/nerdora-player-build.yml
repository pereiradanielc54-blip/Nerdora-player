      - name: Aplicar descoberta incremental de arquivos v0.9.7
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          files = Path("extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt")
          s = files.read_text(encoding="utf-8")

          path_line = '            val paths = withContext(Dispatchers.IO) { UniversalFileIndexCache.readPaths(context) }'
          path_replacement = '''            val paths = withContext(Dispatchers.IO) { UniversalFileIndexCache.readPaths(context) }
              val quickPaths = withContext(Dispatchers.IO) { scanQuickPublicFolders(root) }
              val mergedPaths = (paths + quickPaths).distinct()'''
          assert path_line in s or 'scanQuickPublicFolders(root)' in s, "Linha readPaths não encontrada"
          s = s.replace(path_line, path_replacement, 1)

          old_map = '                paths.asSequence().map(::File).filterNot(::isInsideNerdoraTrash).map(::deviceItem).toList()'
          new_map = '                mergedPaths.asSequence().map(::File).filterNot(::isInsideNerdoraTrash).map(::deviceItem).toList()'
          assert old_map in s or new_map in s, "Linha de montagem do cache não encontrada"
          s = s.replace(old_map, new_map, 1)

          scan_line = '            scanLimited = UniversalFileIndexCache.wasLimited(context)'
          scan_replacement = '''            scanLimited = UniversalFileIndexCache.wasLimited(context)
              if (mergedPaths.size != paths.size) {
                  withContext(Dispatchers.IO) {
                      UniversalFileIndexCache.replace(context, mergedPaths, scanLimited)
                  }
              }'''
          assert scan_line in s or 'mergedPaths.size != paths.size' in s, "Linha wasLimited não encontrada"
          s = s.replace(scan_line, scan_replacement, 1)

          helper_anchor = 'private fun scanTrashFiles(): List<DeviceFileItem>'
          helper = '''private fun scanQuickPublicFolders(root: File, limit: Int = 6000): List<String> {
              val result = ArrayList<String>(512)
              val stack = ArrayDeque<File>()
              listOf(
                  File(root, Environment.DIRECTORY_DOWNLOADS),
                  File(root, Environment.DIRECTORY_DOCUMENTS)
              ).filter { it.exists() && it.isDirectory && it.canRead() }.forEach(stack::add)

              while (stack.isNotEmpty() && result.size < limit) {
                  val dir = stack.removeLast()
                  val children = runCatching { dir.listFiles() }.getOrNull() ?: continue
                  for (child in children) {
                      if (result.size >= limit) break
                      if (shouldHideSystemPath(child) || isInsideNerdoraTrash(child)) continue
                      if (child.isDirectory) stack.add(child)
                      else if (child.isFile) result += child.absolutePath
                  }
              }
              return result
          }

          '''
          assert helper_anchor in s, "Ponto para helper de descoberta rápida não encontrado"
          if 'private fun scanQuickPublicFolders' not in s:
              s = s.replace(helper_anchor, helper + helper_anchor, 1)

          files.write_text(s, encoding="utf-8")
          PY

          sed -i -E 's/versionCode = [0-9]+/versionCode = 67/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.7"/' extracted_project/app/build.gradle.kts

          grep -q 'versionName = "0.9.7"' extracted_project/app/build.gradle.kts
          grep -q 'scanQuickPublicFolders(root)' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'Environment.DIRECTORY_DOWNLOADS' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'Environment.DIRECTORY_DOCUMENTS' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'mergedPaths.size != paths.size' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'ext in setOf("xls", "xlsx")' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.7: índice rápido passa a descobrir automaticamente arquivos novos em Download e Documents."

