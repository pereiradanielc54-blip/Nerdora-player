      - name: Trocar Excel Viewer para Office Kit v0.9.15
        shell: bash
        run: |
          set -euo pipefail

          ASSETS="extracted_project/app/src/main/assets/xlsx_renderer"
          rm -rf "$ASSETS"
          mkdir -p "$ASSETS/licenses"
          cp .github/overlays/v0.9.15/viewer.html "$ASSETS/viewer.html"

