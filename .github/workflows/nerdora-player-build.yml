name: Nerdora Player - Build v0.9.2 Word Reader

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Encontrar pacote base
        id: archive
        shell: bash
        run: |
          ARCHIVE=$(find . -maxdepth 2 -type f -name 'NerdoraPlayer-v0.5.0-PRO-MEDIA.tar.gz' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERRO: pacote base v0.5.0 não encontrado."
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto base
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          tar -xzf "${{ steps.archive.outputs.archive }}" -C extracted_project

      - name: Aplicar atualização v0.6.0
        shell: bash
        run: |
          cat \
            .github/patches/v0.6.0.part1a.b64 \
            .github/patches/v0.6.0.part1b.b64 \
            .github/patches/v0.6.0.part2.b64 \
            .github/patches/v0.6.0.part3.b64 \
            .github/patches/v0.6.0.part4.b64 \
            > /tmp/v060.patch.gz.b64
          base64 -d /tmp/v060.patch.gz.b64 > /tmp/v060.patch.gz
          gzip -t /tmp/v060.patch.gz
          gunzip -c /tmp/v060.patch.gz > /tmp/v060.patch
          cd extracted_project
          patch -p1 < /tmp/v060.patch
          echo "Patch v0.6.0 aplicado no projeto extraído."
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "Versão após patch:"
          grep -nE 'versionCode|versionName|documentfile' app/build.gradle.kts
          sed -i '1i @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          sed -i '1i @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          sed -i 's/formatDate(file.lastModified())/formatFileDate(file.lastModified())/' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          sed -i 's/private fun formatDate(timestamp: Long)/private fun formatFileDate(timestamp: Long)/' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          echo "Hotfixes Kotlin da v0.6.0 aplicados."

      - name: Aplicar integração Android para documentos v0.6.1
        shell: bash
        run: |
          cp .github/overlays/v0.6.1/DocumentOpenActivity.kt extracted_project/app/src/main/java/com/nerdora/player/DocumentOpenActivity.kt
          python3 -c 'from pathlib import Path; p=Path("extracted_project/app/src/main/AndroidManifest.xml"); t=p.read_text(encoding="utf-8"); a=Path(".github/overlays/v0.6.1/document-activity.xml").read_text(encoding="utf-8"); m="    </application>"; assert m in t, "Fechamento de application não encontrado"; p.write_text(t if "android:name=\".DocumentOpenActivity\"" in t else t.replace(m, a+"\\n"+m, 1), encoding="utf-8")'
          sed -i -E 's/versionCode = [0-9]+/versionCode = 31/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.6.1"/' extracted_project/app/build.gradle.kts
          grep -q 'android:name=".DocumentOpenActivity"' extracted_project/app/src/main/AndroidManifest.xml
          grep -q 'application/vnd.openxmlformats-officedocument.wordprocessingml.document' extracted_project/app/src/main/AndroidManifest.xml
          grep -q 'versionName = "0.6.1"' extracted_project/app/build.gradle.kts
          echo "Associação de DOCX/XLSX/PPTX/PDF e documentos de texto aplicada."

      - name: Aplicar Universal Files v0.7.0
        shell: bash
        run: |
          cat \
            .github/overlays/v0.7.0/FilesScreen.part00.b64 \
            .github/overlays/v0.7.0/FilesScreen.part01.b64 \
            .github/overlays/v0.7.0/FilesScreen.part02.b64 \
            .github/overlays/v0.7.0/FilesScreen.part03a.b64 \
            .github/overlays/v0.7.0/FilesScreen.part03b.b64 \
            .github/overlays/v0.7.0/FilesScreen.part03c.b64 \
            .github/overlays/v0.7.0/FilesScreen.part03d.b64 \
            .github/overlays/v0.7.0/FilesScreen.part04.b64 \
            .github/overlays/v0.7.0/FilesScreen.part05.b64 \
            .github/overlays/v0.7.0/FilesScreen.part06.b64 \
            .github/overlays/v0.7.0/FilesScreen.part07.b64 \
            .github/overlays/v0.7.0/FilesScreen.part08.b64 \
            | base64 -d > extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt

          cat \
            .github/overlays/v0.7.0/DocumentViewer.part00.b64 \
            .github/overlays/v0.7.0/DocumentViewer.part01.b64 \
            .github/overlays/v0.7.0/DocumentViewer.part02.b64 \
            .github/overlays/v0.7.0/DocumentViewer.part03.b64 \
            .github/overlays/v0.7.0/DocumentViewer.part04.b64 \
            | base64 -d > extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt

          cp .github/overlays/v0.7.0/UniversalFilesStore.kt extracted_project/app/src/main/java/com/nerdora/player/UniversalFilesStore.kt
          cp .github/overlays/v0.7.0/file_paths.xml extracted_project/app/src/main/res/xml/file_paths.xml

          python3 -c 'from pathlib import Path; p=Path("extracted_project/app/src/main/AndroidManifest.xml"); t=p.read_text(encoding="utf-8"); perm="    <uses-permission android:name=\"android.permission.MANAGE_EXTERNAL_STORAGE\" />\n"; needle="<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\">\n"; assert needle in t; p.write_text(t if "MANAGE_EXTERNAL_STORAGE" in t else t.replace(needle, needle+"\n"+perm, 1), encoding="utf-8")'

          sed -i -E 's/versionCode = [0-9]+/versionCode = 40/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.7.0"/' extracted_project/app/build.gradle.kts

          test -s extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -s extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f extracted_project/app/src/main/java/com/nerdora/player/UniversalFilesStore.kt
          grep -q 'MANAGE_EXTERNAL_STORAGE' extracted_project/app/src/main/AndroidManifest.xml
          grep -q 'external-path' extracted_project/app/src/main/res/xml/file_paths.xml
          grep -q 'versionName = "0.7.0"' extracted_project/app/build.gradle.kts
          echo "Universal Files v0.7.0 aplicado."

      - name: Aplicar melhorias v0.8.0
        shell: bash
        run: |
          rm -rf /tmp/nerdora-v080
          mkdir -p /tmp/nerdora-v080
          cat \
            .github/overlays/v0.8.0/payload.part00.b64 \
            .github/overlays/v0.8.0/payload.part01.b64 \
            | base64 -d > /tmp/nerdora-v080/payload.tar.gz
          echo "ea4d2c8872571ab3f2fd7a0392e5af1cdba43a978891964b665e87630e0de46e  /tmp/nerdora-v080/payload.tar.gz" | sha256sum -c -
          tar -xzf /tmp/nerdora-v080/payload.tar.gz -C /tmp/nerdora-v080

          cp /tmp/nerdora-v080/NerdoraAccountStore.kt extracted_project/app/src/main/java/com/nerdora/player/NerdoraAccountStore.kt
          cp /tmp/nerdora-v080/UniversalFileIndexCache.kt extracted_project/app/src/main/java/com/nerdora/player/UniversalFileIndexCache.kt
          cp /tmp/nerdora-v080/AccountScreen.kt extracted_project/app/src/main/java/com/nerdora/player/ui/AccountScreen.kt
          python3 /tmp/nerdora-v080/apply_v080.py

          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt")
          t = p.read_text(encoding="utf-8")
          if "import androidx.activity.compose.BackHandler" not in t:
              t = t.replace(
                  "import androidx.activity.compose.rememberLauncherForActivityResult\n",
                  "import androidx.activity.compose.BackHandler\nimport androidx.activity.compose.rememberLauncherForActivityResult\n",
                  1,
              )
          if "BackHandler(enabled = folder != null)" not in t:
              marker = '    val sort = runCatching { FileSort.valueOf(sortName) }.getOrDefault(FileSort.NEWEST)\n'
              back = '''    BackHandler(enabled = folder != null) {
                  val current = folder
                  folder = when {
                      current == null -> null
                      current.absolutePath == root.absolutePath -> null
                      current.parentFile != null && current.parentFile!!.absolutePath.startsWith(root.absolutePath) -> current.parentFile
                      else -> null
                  }
                  query = ""
              }

              '''
              assert marker in t, "Ponto para Back nas pastas não encontrado"
              t = t.replace(marker, back + marker, 1)
          if "BackHandler(enabled = stack.isNotEmpty())" not in t:
              marker = '    var refresh by remember { mutableIntStateOf(0) }\n    LaunchedEffect(current?.uri, refresh) {'
              replacement = '''    var refresh by remember { mutableIntStateOf(0) }
              BackHandler(enabled = stack.isNotEmpty()) {
                  current = stack.last()
                  stack = stack.dropLast(1)
                  query = ""
              }
              LaunchedEffect(current?.uri, refresh) {'''
              assert marker in t, "Ponto para Back no navegador SAF não encontrado"
              t = t.replace(marker, replacement, 1)
          p.write_text(t, encoding="utf-8")
          PY

          sed -i -E 's/versionCode = [0-9]+/versionCode = 50/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.8.0"/' extracted_project/app/build.gradle.kts

          grep -q 'versionName = "0.8.0"' extracted_project/app/build.gradle.kts
          grep -q 'BackHandler' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'AppScreen.ACCOUNT' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'mediaIndexInitialized' extracted_project/app/src/main/java/com/nerdora/player/PlayerPreferences.kt
          grep -q 'UniversalFileIndexCache.readPaths' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'BackHandler(enabled = folder != null)' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'BackHandler(enabled = stack.isNotEmpty())' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f extracted_project/app/src/main/java/com/nerdora/player/NerdoraAccountStore.kt
          test -f extracted_project/app/src/main/java/com/nerdora/player/ui/AccountScreen.kt
          echo "v0.8.0: conta, navegação Voltar e índices persistentes aplicados."

      - name: Aplicar Visual Refresh v0.9.0
        shell: bash
        run: |
          rm -rf /tmp/nerdora-v090
          mkdir -p /tmp/nerdora-v090
          cat \
            .github/overlays/v0.9.0/payload.part00.b64 \
            .github/overlays/v0.9.0/payload.part01.b64 \
            .github/overlays/v0.9.0/payload.part02.b64 \
            .github/overlays/v0.9.0/payload.part03.b64 \
            | base64 -d > /tmp/nerdora-v090/payload.tar.gz
          gzip -t /tmp/nerdora-v090/payload.tar.gz
          tar -tzf /tmp/nerdora-v090/payload.tar.gz >/dev/null
          tar -xzf /tmp/nerdora-v090/payload.tar.gz -C /tmp/nerdora-v090

          cp /tmp/nerdora-v090/VideoPlayer.kt extracted_project/app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          cp /tmp/nerdora-v090/NerdoraTheme.kt extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          cp /tmp/nerdora-v090/SettingsScreen.kt extracted_project/app/src/main/java/com/nerdora/player/ui/SettingsScreen.kt
          python3 /tmp/nerdora-v090/apply_v090.py

          sed -i -E 's/versionCode = [0-9]+/versionCode = 61/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.1"/' extracted_project/app/build.gradle.kts

          grep -q 'versionName = "0.9.1"' extracted_project/app/build.gradle.kts
          grep -q 'formatDuration(position)' extracted_project/app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          grep -q 'SmallVideoAction' extracted_project/app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          grep -q '"CYBER"' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q '"SAKURA"' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q '"EMERALD"' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q '"AURORA"' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q 'categoryFor(file.name, mime).label' extracted_project/app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'settings.useWideViewPort = true' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "Visual Refresh v0.9.1 preparado com assinatura permanente."

      - name: Aplicar Word Reader v0.9.2
        shell: bash
        run: |
          set -euo pipefail
          cp .github/overlays/v0.9.2/WordDocumentViewer.kt extracted_project/app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt

          python3 - <<'PY'
          from pathlib import Path

          viewer = Path("extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt")
          text = viewer.read_text(encoding="utf-8")

          old = "private enum class DocumentKind { PDF, DOCX, XLSX, PPTX, ZIP, TEXT, OTHER }"
          new = "private enum class DocumentKind { PDF, DOC, DOCX, XLSX, PPTX, ZIP, TEXT, OTHER }"
          assert old in text or new in text, "Enum DocumentKind não encontrado"
          text = text.replace(old, new)

          old = 'DocumentKind.DOCX -> "Word • layout aprimorado"'
          new = 'DocumentKind.DOC, DocumentKind.DOCX -> "Word • páginas reais + cache"'
          assert old in text or new in text, "Título Word não encontrado"
          text = text.replace(old, new)

          old = 'DocumentKind.DOCX -> RichHtmlViewer(document.uri) { OfficeHtmlReader.readDocx(context, document.uri) }'
          new = 'DocumentKind.DOC, DocumentKind.DOCX -> WordDocumentViewer(context, document)'
          assert old in text or new in text, "Rota DOCX não encontrada"
          text = text.replace(old, new)

          old = 'ext=="docx"||mime.contains("wordprocessingml")->DocumentKind.DOCX;'
          new = 'ext=="doc"||mime=="application/msword"->DocumentKind.DOC;ext=="docx"||mime.contains("wordprocessingml")->DocumentKind.DOCX;'
          assert old in text or new in text, "Detecção DOCX não encontrada"
          text = text.replace(old, new)

          viewer.write_text(text, encoding="utf-8")

          manifest = Path("extracted_project/app/src/main/AndroidManifest.xml")
          m = manifest.read_text(encoding="utf-8")
          wordx = '                <data android:mimeType="application/vnd.openxmlformats-officedocument.wordprocessingml.document" />'
          legacy = '                <data android:mimeType="application/msword" />'
          assert wordx in m, "MIME DOCX não encontrado no manifest"
          if legacy not in m:
              m = m.replace(wordx, wordx + "\n" + legacy, 1)
          manifest.write_text(m, encoding="utf-8")
          PY

          sed -i -E 's/versionCode = [0-9]+/versionCode = 62/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.2"/' extracted_project/app/build.gradle.kts

          grep -q 'versionName = "0.9.2"' extracted_project/app/build.gradle.kts
          grep -q 'DocumentKind.DOC, DocumentKind.DOCX -> WordDocumentViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'fun WordDocumentViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'word_pdf' extracted_project/app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'application/msword' extracted_project/app/src/main/AndroidManifest.xml
          echo "Word Reader v0.9.2 aplicado."

      - name: Diagnosticar atualizador atual
        shell: bash
        run: |
          set -euo pipefail
          echo "=== arquivos relacionados a update/release/github/download ==="
          grep -RIlE 'update|atualiza|release|github|DownloadManager|browser_download_url|ACTION_VIEW|REQUEST_INSTALL_PACKAGES' extracted_project/app/src/main/java extracted_project/app/src/main/AndroidManifest.xml 2>/dev/null || true
          echo "=== ocorrências com contexto ==="
          grep -RInE -C 5 'update|atualiza|release|github|DownloadManager|browser_download_url|ACTION_VIEW|REQUEST_INSTALL_PACKAGES' extracted_project/app/src/main/java extracted_project/app/src/main/AndroidManifest.xml 2>/dev/null | head -n 1200 || true

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Identificar versão
        id: version
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VERSION" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar e validar chave permanente
        id: signing
        shell: bash
        env:
          NERDORA_KEYSTORE_BASE64: ${{ secrets.NERDORA_KEYSTORE_BASE64 }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NERDORA_KEYSTORE_BASE64"
          test -n "$NERDORA_KEYSTORE_PASSWORD"
          test -n "$NERDORA_KEY_ALIAS"
          test -n "$NERDORA_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/nerdora-release.jks"
          printf '%s' "$NERDORA_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list             -keystore "$KEYSTORE"             -storepass "$NERDORA_KEYSTORE_PASSWORD"             -alias "$NERDORA_KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Chave permanente restaurada e validada sem expor credenciais."

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Validar Nerdora Player
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts
          grep -q 'versionName = "0.9.2"' app/build.gradle.kts
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f app/src/main/java/com/nerdora/player/DocumentOpenActivity.kt
          grep -q 'android:name=".DocumentOpenActivity"' app/src/main/AndroidManifest.xml
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'readXlsx' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'AppScreen.ACCOUNT' app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'UniversalFileIndexCache' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'SmallVideoAction' app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          grep -q '"CYBER"' app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q 'settings.useWideViewPort = true' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'fun WordDocumentViewer' app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'application/msword' app/src/main/AndroidManifest.xml
          echo "Nerdora Player v0.9.2 validado."

      - name: Compilar APK Release assinado
        id: build
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          NERDORA_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon :app:assembleRelease -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar e verificar APK assinado
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p final-apk
          FINAL="final-apk/Nerdora-Player-v${VERSION}.apk"
          cp "$APK" "$FINAL"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL"

          sha256sum "$FINAL" | tee final-apk/SHA256SUMS.txt
          ls -lh final-apk/

      - name: Publicar APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v${{ steps.version.outputs.version }}
          path: |
            final-apk/*.apk
            final-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release pública v0.9.2 assinada
        if: steps.build.outputs.status == '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          APK="final-apk/Nerdora-Player-v${VERSION}.apk"
          TITLE="Nerdora Player v${VERSION} — Word Reader"
          NOTES="Nerdora Player v0.9.2: novo leitor interno de Word. DOCX agora é convertido para PDF temporário em cache, preservando melhor páginas, fontes, tamanhos, negrito, itálico, sublinhado, cores, alinhamento, tabelas, imagens, cabeçalho, rodapé e quebras de página. O leitor ganhou miniaturas, busca, indicador e salto de página, texto selecionável, zoom por pinça e duplo toque, além de memória da última página. DOC legado ganhou compatibilidade interna de texto e continua podendo ser aberto em outro app quando for necessária fidelidade total. A Release continua assinada com a mesma chave permanente da v0.9.1 para atualização por cima."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Mostrar erro
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          tail -n 220 nerdora-player-build.log
          exit 1
