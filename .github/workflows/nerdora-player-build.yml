name: Nerdora Player - Build Profissional

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7
        with:
          lfs: true

      - name: Encontrar pacote mais recente
        id: archive
        shell: bash
        run: |
          ARCHIVE=$(find . -maxdepth 2 -type f -name 'NerdoraPlayer-*.tar.gz' | sort -V | tail -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERRO: nenhum NerdoraPlayer-*.tar.gz encontrado."
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Pacote: $ARCHIVE"

      - name: Validar pacote
        shell: bash
        run: |
          ARCHIVE="${{ steps.archive.outputs.archive }}"
          ls -lh "$ARCHIVE"
          file "$ARCHIVE"
          sha256sum "$ARCHIVE"
          if grep -aq '^version https://git-lfs.github.com/spec/v1' "$ARCHIVE"; then
            echo "ERRO: pacote é apenas um ponteiro Git LFS."
            exit 1
          fi
          gzip -t "$ARCHIVE"
          tar -tzf "$ARCHIVE" >/dev/null
          echo "Pacote válido."

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          tar -xzf "${{ steps.archive.outputs.archive }}" -C extracted_project

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Identificar versão
        id: version
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VERSION" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Usar SDK Android do GitHub
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: Android SDK não encontrado em $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Validar Nerdora Player
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts
          echo "NerdoraPlayer validado."

      - name: Compilar APK de teste
        id: debugbuild
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug \
            -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mostrar erro real
        if: steps.debugbuild.outputs.status != '0'
        shell: bash
        run: |
          echo '## Erro real do Nerdora Player' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -Ei -B 4 -A 14 '(^e: |error:|unresolved reference|cannot access|compilation error|execution failed for task|what went wrong|a failure occurred|caused by:)' nerdora-player-build.log \
            | head -n 300 | tee nerdora-player-errors.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat nerdora-player-errors.txt 2>/dev/null || tail -n 200 nerdora-player-build.log

      - name: Preparar APK de teste
        if: steps.debugbuild.outputs.status == '0'
        shell: bash
        run: |
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p final-apk
          cp "$APK" "final-apk/Nerdora-Player-v${VERSION}-debug.apk"

      - name: Preparar assinatura permanente
        id: signing
        if: steps.debugbuild.outputs.status == '0'
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.NERDORA_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nerdora-release.jks"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Secrets de assinatura não configurados; somente APK de teste será criado."
          fi

      - name: Compilar APK Release assinado
        if: steps.signing.outputs.enabled == 'true'
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          NERDORA_KEYSTORE_PATH: ${{ runner.temp }}/nerdora-release.jks
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :app:assembleRelease \
            -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            --console=plain
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "final-apk/Nerdora-Player-v${VERSION}-release.apk"

      - name: Publicar APKs
        if: steps.debugbuild.outputs.status == '0'
        uses: actions/upload-artifact@v7
        with:
          name: Nerdora-Player-v${{ steps.version.outputs.version }}
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar log em caso de erro
        if: always() && steps.debugbuild.outputs.status != '0'
        uses: actions/upload-artifact@v7
        with:
          name: Nerdora-Player-LOG-ERRO
          path: |
            nerdora-player-build.log
            nerdora-player-errors.txt
          if-no-files-found: warn
          retention-days: 7


      - name: Encerrar com erro de compilação
        if: always() && steps.debugbuild.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Criar GitHub Release ao enviar tag
        if: startsWith(github.ref, 'refs/tags/') && steps.signing.outputs.enabled == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$TAG" "final-apk/Nerdora-Player-v${VERSION}-release.apk" \
            --title "Nerdora Player $TAG" \
            --generate-notes
