name: Nerdora Player - Build v0.6.x

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
    tags:
      - 'v*'

permissions:
  contents: write

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Encontrar pacote base
        id: archive
        shell: bash
        run: |
          ARCHIVE=$(find . -maxdepth 2 -type f -name 'NerdoraPlayer-v0.5.0-PRO-MEDIA.tar.gz' | head -n 1)
          if [ -z "$ARCHIVE" ]; then
            echo "ERRO: pacote base v0.5.0 não encontrado."
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto base
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          tar -xzf "${{ steps.archive.outputs.archive }}" -C extracted_project

      - name: Aplicar atualização v0.6.0
        shell: bash
        run: |
          cat \
            .github/patches/v0.6.0.part1a.b64 \
            .github/patches/v0.6.0.part1b.b64 \
            .github/patches/v0.6.0.part2.b64 \
            .github/patches/v0.6.0.part3.b64 \
            .github/patches/v0.6.0.part4.b64 \
            > /tmp/v060.patch.gz.b64
          base64 -d /tmp/v060.patch.gz.b64 > /tmp/v060.patch.gz
          gzip -t /tmp/v060.patch.gz
          gunzip -c /tmp/v060.patch.gz > /tmp/v060.patch
          cd extracted_project
          patch -p1 < /tmp/v060.patch
          echo "Patch v0.6.0 aplicado no projeto extraído."
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "Versão após patch:"
          grep -nE 'versionCode|versionName|documentfile' app/build.gradle.kts
          sed -i '1i @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          sed -i '1i @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          sed -i 's/formatDate(file.lastModified())/formatFileDate(file.lastModified())/' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          sed -i 's/private fun formatDate(timestamp: Long)/private fun formatFileDate(timestamp: Long)/' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          echo "Hotfixes Kotlin da v0.6.0 aplicados."

      - name: Inspecionar suporte a documentos
        shell: bash
        run: |
          echo "=== MANIFEST ==="
          sed -n '1,260p' extracted_project/app/src/main/AndroidManifest.xml
          echo "=== MAIN ACTIVITY ==="
          sed -n '1,320p' extracted_project/app/src/main/java/com/nerdora/player/MainActivity.kt
          echo "=== DOCUMENT VIEWER ==="
          sed -n '1,320p' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "=== APP ==="
          sed -n '35,180p' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          echo "=== DOCUMENT REF MODEL ==="
          grep -R -n -A 30 -B 5 "data class DocumentRef" extracted_project/app/src/main/java/com/nerdora/player/model || true
      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Identificar versão
        id: version
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VERSION" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Validar Nerdora Player
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts
          grep -q 'versionName = "0.6.0"' app/build.gradle.kts
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          echo "Nerdora Player v0.6.0 validado."

      - name: Compilar APK
        id: build
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar APK
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/debug" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p final-apk
          cp "$APK" "final-apk/Nerdora-Player-v${VERSION}.apk"
          ls -lh final-apk/

      - name: Publicar APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v${{ steps.version.outputs.version }}
          path: final-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Mostrar erro
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          tail -n 220 nerdora-player-build.log
          exit 1
