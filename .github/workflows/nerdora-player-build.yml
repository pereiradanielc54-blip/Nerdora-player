          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.10"/' extracted_project/app/build.gradle.kts

          VIEWER="extracted_project/app/src/main/assets/xlsx_renderer/viewer.html"

          grep -q 'versionName = "0.9.10"' extracted_project/app/build.gradle.kts
          grep -q 'computeUsedBounds' "$VIEWER"
          grep -q 'applyFitToWidth' "$VIEWER"
          grep -q 'parseWorkbook' "$VIEWER"
          grep -q 'parseStyles' "$VIEWER"
          grep -q 'parseSharedStrings' "$VIEWER"
          grep -q 'relationshipId' "$VIEWER"
          ! grep -q 'LuckyExcel.transformExcelToLucky' "$VIEWER"
          ! grep -q 'luckysheet.create' "$VIEWER"
          ! grep -q 'Somente leitura •' extracted_project/app/src/main/java/com/nerdora/player/ui/HighFidelityXlsxViewer.kt

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("extracted_project/app/src/main/assets/xlsx_renderer/viewer.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts, "Script inline do XLSX v0.9.10 não encontrado"
          Path("/tmp/xlsx-final-fit.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/xlsx-final-fit.js

          test -s extracted_project/app/src/main/assets/docx_renderer/jszip.min.js
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.10: Excel usa recorte da área útil, leitura OOXML direta e ajuste automático à largura."

      - name: Aplicar correção definitiva da área XLSX v0.9.11
        shell: bash
        run: |
          set -euo pipefail

          cp .github/overlays/v0.9.11/viewer.html \
            extracted_project/app/src/main/assets/xlsx_renderer/viewer.html

          sed -i -E 's/versionCode = [0-9]+/versionCode = 71/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.11"/' extracted_project/app/build.gradle.kts

          VIEWER="extracted_project/app/src/main/assets/xlsx_renderer/viewer.html"

          grep -q 'versionName = "0.9.11"' extracted_project/app/build.gradle.kts
          grep -q 'extractRawBounds' "$VIEWER"
          grep -q 'unionBounds' "$VIEWER"
          grep -q 'rawBounds' "$VIEWER"
          grep -q 'body.has-tabs #viewport' "$VIEWER"
          grep -q 'position: fixed' "$VIEWER"
          grep -q 'height: 100vh' "$VIEWER"
          grep -q 'nodeLocalName' "$VIEWER"
          grep -q 'getElementsByTagName("\*")' "$VIEWER"
          grep -q 'parseSheetXml(xmlText, path' "$VIEWER"
          ! grep -q 'LuckyExcel.transformExcelToLucky' "$VIEWER"
          ! grep -q 'luckysheet.create' "$VIEWER"

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("extracted_project/app/src/main/assets/xlsx_renderer/viewer.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts, "Script inline XLSX v0.9.11 não encontrado"
          Path("/tmp/xlsx-v0911.js").write_text("\n".join(scripts), encoding="utf-8")

          # Teste de regressão do caso que estava cortando: XML prefixado com células até H20.
          cell_re = re.compile(r'<(?:[A-Za-z_][\w.-]*:)?c\b[^>]*\br=["\']([A-Za-z]+\d+)["\']')
          sample = '<x:worksheet><x:sheetData><x:row r="1"><x:c r="A1"/></x:row><x:row r="20"><x:c r="H20"/></x:row></x:sheetData></x:worksheet>'
          refs = cell_re.findall(sample)
          assert refs == ["A1", "H20"], refs
          PY
          node --check /tmp/xlsx-v0911.js

          test -s extracted_project/app/src/main/assets/docx_renderer/jszip.min.js
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.11: área do XLSX é derivada das células reais do XML e o viewport ocupa 100% da altura."

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Identificar versão
        id: version
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VERSION" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar e validar chave permanente
        id: signing
        shell: bash
        env:
          NERDORA_KEYSTORE_BASE64: ${{ secrets.NERDORA_KEYSTORE_BASE64 }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NERDORA_KEYSTORE_BASE64"
          test -n "$NERDORA_KEYSTORE_PASSWORD"
          test -n "$NERDORA_KEY_ALIAS"
          test -n "$NERDORA_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/nerdora-release.jks"
          printf '%s' "$NERDORA_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list             -keystore "$KEYSTORE"             -storepass "$NERDORA_KEYSTORE_PASSWORD"             -alias "$NERDORA_KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Chave permanente restaurada e validada sem expor credenciais."

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Validar Nerdora Player
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts
          grep -q 'versionName = "0.9.11"' app/build.gradle.kts
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f app/src/main/java/com/nerdora/player/DocumentOpenActivity.kt
          grep -q 'android:name=".DocumentOpenActivity"' app/src/main/AndroidManifest.xml
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'readXlsx' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'AppScreen.ACCOUNT' app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'UniversalFileIndexCache' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'SmallVideoAction' app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          grep -q '"CYBER"' app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q 'settings.useWideViewPort = true' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'fun WordDocumentViewer' app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'application/msword' app/src/main/AndroidManifest.xml
          grep -q 'Baixar e instalar' app/src/main/java/com/nerdora/player/ui/UpdateUi.kt
          grep -q 'updateDialogResult' app/src/main/java/com/nerdora/player/ui/SettingsScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/HighFidelityDocxViewer.kt
          test -s app/src/main/assets/docx_renderer/docx-renderer.umd.js
          test -s app/src/main/assets/docx_renderer/fonts/carlito-400.woff2
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/HighFidelityXlsxViewer.kt
          test -s app/src/main/assets/xlsx_renderer/luckyexcel.umd.js
          test -s app/src/main/assets/xlsx_renderer/luckysheet/luckysheet.umd.js
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'scanQuickPublicFolders(root)' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'parseWorkbook' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'computeUsedBounds' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'extractRawBounds' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'rawBounds' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'body.has-tabs #viewport' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'applyFitToWidth' app/src/main/assets/xlsx_renderer/viewer.html
          ! grep -q 'LuckyExcel.transformExcelToLucky' app/src/main/assets/xlsx_renderer/viewer.html
          ! grep -q 'luckysheet.create' app/src/main/assets/xlsx_renderer/viewer.html
          echo "Nerdora Player v0.9.11 validado."

      - name: Compilar APK Release assinado
        id: build
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          NERDORA_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon :app:assembleRelease -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar e verificar APK assinado
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p final-apk
          FINAL="final-apk/Nerdora-Player-v${VERSION}.apk"
          cp "$APK" "$FINAL"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL"

          sha256sum "$FINAL" | tee final-apk/SHA256SUMS.txt
          ls -lh final-apk/

      - name: Publicar APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v${{ steps.version.outputs.version }}
          path: |
            final-apk/*.apk
            final-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release pública v0.9.11 assinada
        if: steps.build.outputs.status == '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          APK="final-apk/Nerdora-Player-v${VERSION}.apk"
          TITLE="Nerdora Player v${VERSION} — Correção de corte do Excel"
          NOTES="Nerdora Player v0.9.11: corrige o corte que fazia o Excel exibir apenas a primeira linha. A área da folha passa a usar diretamente todas as referências de células e mesclas existentes no XML do XLSX, além da análise visual, evitando que o documento termine logo após o título. O parser de namespaces foi reforçado para Android WebView e o visualizador agora ocupa 100% da altura disponível, com abas fixadas no rodapé e a folha rolável acima. Mantém ajuste automático à largura e não altera o leitor Word."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Mostrar erro
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          tail -n 220 nerdora-player-build.log
          exit 1
