          mkdir -p /tmp/nerdora-officekit
          cd /tmp/nerdora-officekit
          npm init -y >/dev/null 2>&1
          npm install --silent --no-audit --no-fund \
            @office-kit/xlsx@0.21.1 \
            esbuild@0.25.9 \
            exceljs@4.4.0

          cp "$GITHUB_WORKSPACE/.github/overlays/v0.9.15/officekit-viewer.ts" ./officekit-viewer.ts
          npx esbuild ./officekit-viewer.ts \
            --bundle \
            --format=iife \
            --global-name=NerdoraOfficeKit \
            --platform=browser \
            --target=chrome100 \
            --minify \
            --outfile="$GITHUB_WORKSPACE/$ASSETS/officekit-viewer.js"

          LIC=$(find node_modules/@office-kit/xlsx -maxdepth 2 -type f -iname 'LICENSE*' | head -n 1 || true)
          test -n "$LIC"
          cp "$LIC" "$GITHUB_WORKSPACE/$ASSETS/licenses/office-kit-xlsx-LICENSE.txt"
          NOTICE=$(find node_modules/@office-kit/xlsx -maxdepth 2 -type f -iname 'THIRD_PARTY_NOTICES*' | head -n 1 || true)
          if [ -n "$NOTICE" ]; then
            cp "$NOTICE" "$GITHUB_WORKSPACE/$ASSETS/licenses/office-kit-xlsx-THIRD_PARTY_NOTICES.txt"
          fi

          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import ExcelJS from 'exceljs';
          import { fromArrayBuffer, loadWorkbook } from '@office-kit/xlsx/io';
          import { iterWorksheets } from '@office-kit/xlsx/workbook';
          import { getCell, getCellExtent, getMergedCells } from '@office-kit/xlsx/worksheet';
          import { getCellDisplayText } from '@office-kit/xlsx/styles';

          // Gera um XLSX por uma biblioteca independente e o reabre no Office Kit.
          // Isso evita testar apenas o próprio round-trip do novo motor.
          const source = new ExcelJS.Workbook();
          const resumo = source.addWorksheet('Resumo');
          source.addWorksheet('Vendas');
          source.addWorksheet('Layout & Mesclas');

          resumo.mergeCells('A1:H2');
          resumo.getCell('A1').value = 'NERDORA PLAYER — TESTE DE FIDELIDADE EXCEL';
          resumo.getCell('A1').font = { name: 'Calibri', size: 18, bold: true, color: { argb: 'FFFFFFFF' } };
          resumo.getCell('A1').fill = { type: 'pattern', pattern: 'solid', fgColor: { argb: 'FF5B21B6' } };
          resumo.getCell('A20').value = 'fim';
          resumo.getCell('H20').value = 123.45;
          resumo.getCell('H20').numFmt = '"R$" #,##0.00';
          resumo.getColumn(1).width = 24;
          resumo.getRow(20).height = 26;

          const generated = await source.xlsx.writeBuffer();
          fs.writeFileSync('/tmp/Teste_Nerdora_Excel.xlsx', Buffer.from(generated));

          const bytes = new Uint8Array(fs.readFileSync('/tmp/Teste_Nerdora_Excel.xlsx'));
          const wb = await loadWorkbook(fromArrayBuffer(bytes));
          const sheets = [...iterWorksheets(wb)];

          if (sheets.length !== 3) throw new Error('Fixture deveria ter 3 abas, recebeu ' + sheets.length);
          if (sheets[0].title !== 'Resumo') throw new Error('Primeira aba divergente: ' + sheets[0].title);

          const ext = getCellExtent(sheets[0]);
          if (!ext || ext.minRow !== 1 || ext.minCol !== 1 || ext.maxRow < 20 || ext.maxCol < 8) {
            throw new Error('Área útil da aba Resumo divergente: ' + JSON.stringify(ext));
          }

          const a1 = getCell(sheets[0], 1, 1);
          if (!a1) throw new Error('A1 ausente na fixture');
          const title = getCellDisplayText(wb, a1);
          if (!title.includes('NERDORA PLAYER')) throw new Error('Título A1 divergente: ' + title);

          const merges = getMergedCells(sheets[0]);
          if (!merges.some(m => m.minRow === 1 && m.maxRow === 2 && m.minCol === 1 && m.maxCol === 8)) {
            throw new Error('Mesclagem A1:H2 não encontrada');
          }

          console.log('Office Kit 0.21.1 validado contra XLSX externo:', {
            sheets: sheets.map(s => s.title),
            extent: ext,
            title,
            merges: merges.length
          });
          JS

          cd "$GITHUB_WORKSPACE"

          sed -i -E 's/versionCode = [0-9]+/versionCode = 75/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.15"/' extracted_project/app/build.gradle.kts

          VIEWER="$ASSETS/viewer.html"

          grep -q 'versionName = "0.9.15"' extracted_project/app/build.gradle.kts
          test -s "$ASSETS/officekit-viewer.js"
          test -s "$ASSETS/licenses/office-kit-xlsx-LICENSE.txt"
          grep -q 'officekit-viewer.js' "$VIEWER"
          grep -q 'NerdoraOfficeKit.renderXlsx' "$VIEWER"
          grep -q 'body.has-tabs #viewport' "$VIEWER"
          grep -q 'bottom: 60px' "$VIEWER"
          node --check "$ASSETS/officekit-viewer.js"

          test ! -e "$ASSETS/exceljs.min.js"
          test ! -e "$ASSETS/luckyexcel.umd.js"
          test ! -e "$ASSETS/luckysheet"

          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.15: Excel Viewer migrado para Office Kit XLSX 0.21.1; Word preservado."

