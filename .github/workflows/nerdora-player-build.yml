          }

          cp "$GITHUB_WORKSPACE/.github/overlays/v0.9.16/fortune-sheet-LICENSE.txt" \
            "$GITHUB_WORKSPACE/$ASSETS/licenses/fortune-sheet-react-LICENSE.txt"
          cp "$GITHUB_WORKSPACE/.github/overlays/v0.9.16/fortune-sheet-LICENSE.txt" \
            "$GITHUB_WORKSPACE/$ASSETS/licenses/fortune-sheet-core-LICENSE.txt"
          cp "$GITHUB_WORKSPACE/.github/overlays/v0.9.16/fortune-excel-LICENSE.txt" \
            "$GITHUB_WORKSPACE/$ASSETS/licenses/fortune-excel-LICENSE.txt"
          copy_license node_modules/react react-LICENSE.txt
          copy_license node_modules/react-dom react-dom-LICENSE.txt

          node <<'JS'
          const ExcelJS = require("exceljs");

          global.File = function TestFile(parts, name, options = {}) {
            const buffers = parts.map(part => {
              if (Buffer.isBuffer(part)) return part;
              if (part instanceof ArrayBuffer) return Buffer.from(part);
              if (ArrayBuffer.isView(part)) return Buffer.from(part.buffer, part.byteOffset, part.byteLength);
              return Buffer.from(String(part));
            });
            const buffer = Buffer.concat(buffers);
            buffer.name = name;
            buffer.type = options.type || "";
            buffer.arrayBuffer = async () =>
              buffer.buffer.slice(buffer.byteOffset, buffer.byteOffset + buffer.byteLength);
            buffer.text = async () => buffer.toString();
            return buffer;
          };
          global.window = { navigator: { userAgent: "node-test" } };

          const { transformExcelToFortune } = require("@corbe30/fortune-excel");

          (async () => {
            const wb = new ExcelJS.Workbook();
            const resumo = wb.addWorksheet("Resumo");
            wb.addWorksheet("Vendas");
            wb.addWorksheet("Layout & Mesclas");

            resumo.mergeCells("A1:H2");
            resumo.getCell("A1").value = "NERDORA PLAYER — TESTE DE FIDELIDADE EXCEL";
            resumo.getCell("A1").font = { name: "Calibri", size: 18, bold: true };
            resumo.getCell("A1").fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF5B21B6" } };
            resumo.getCell("H20").value = 123.45;
            resumo.getCell("H20").numFmt = '"R$" #,##0.00';
            resumo.getColumn(1).width = 24;
            resumo.getRow(20).height = 26;

            const buffer = Buffer.from(await wb.xlsx.writeBuffer());
            const file = new File([buffer], "Teste_Nerdora_Excel.xlsx", {
              type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"
            });

            let sheets = null;
            await transformExcelToFortune(
              file,
              value => { sheets = value; },
              () => {},
              {
                current: {
                  setColumnWidth: () => {},
                  setRowHeight: () => {}
                }
              }
            );

            await new Promise(resolve => setTimeout(resolve, 20));

            if (!Array.isArray(sheets) || sheets.length !== 3) {
              throw new Error("FortuneExcel deveria retornar 3 abas.");
            }
            if (sheets[0].name !== "Resumo") {
              throw new Error("Primeira aba divergente: " + sheets[0].name);
            }

            const a1 = sheets[0].celldata.find(c => c.r === 0 && c.c === 0);
            const h20 = sheets[0].celldata.find(c => c.r === 19 && c.c === 7);
            if (!a1 || !String(a1.v?.v ?? a1.v?.m ?? "").includes("NERDORA PLAYER")) {
              throw new Error("A1 não foi importada corretamente.");
            }
            if (!h20 || Number(h20.v?.v) !== 123.45) {
              throw new Error("H20 não foi importada corretamente.");
            }

            const merges = sheets[0].config?.merge || {};
            const hasMerge = Object.values(merges).some(m =>
              Number(m.r) === 0 && Number(m.c) === 0 && Number(m.rs) === 2 && Number(m.cs) === 8
            );
            if (!hasMerge) throw new Error("Mesclagem A1:H2 não foi importada.");

            console.log("FortuneExcel 2.3.3 validado:", {
              sheets: sheets.map(s => s.name),
              cells: sheets[0].celldata.length,
              mergeCount: Object.keys(merges).length
            });
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS

          cd "$GITHUB_WORKSPACE"

          sed -i -E 's/versionCode = [0-9]+/versionCode = 76/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.16"/' extracted_project/app/build.gradle.kts

          VIEWER="$ASSETS/viewer.html"

          grep -q 'versionName = "0.9.16"' extracted_project/app/build.gradle.kts
          test -s "$ASSETS/fortune-viewer.js"
          test -s "$ASSETS/fortune-sheet.css"
          test -s "$ASSETS/licenses/fortune-sheet-react-LICENSE.txt"
          test -s "$ASSETS/licenses/fortune-excel-LICENSE.txt"
          grep -q 'fortune-sheet.css' "$VIEWER"
          grep -q 'fortune-viewer.js' "$VIEWER"
          grep -q 'width: 100%' "$VIEWER"
          grep -q 'height: 100%' "$VIEWER"
          node --check "$ASSETS/fortune-viewer.js"

          test ! -e "$ASSETS/officekit-viewer.js"
          test ! -e "$ASSETS/exceljs.min.js"
          test ! -e "$ASSETS/luckyexcel.umd.js"
          test ! -e "$ASSETS/luckysheet"

          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.16: Excel Viewer migrado para FortuneSheet 1.0.4 + FortuneExcel 2.3.3; Word preservado."

      - name: Aplicar Home Oficial v0.9.17
        shell: bash
        run: |
          set -euo pipefail

          cp .github/overlays/v0.9.17/HomeScreen.kt             extracted_project/app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          cp .github/overlays/v0.9.17/NerdoraOfficialBottomBar.kt             extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraOfficialBottomBar.kt

          python3 - <<'PY'
          from pathlib import Path

          app_path = Path("extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt")
          app = app_path.read_text(encoding="utf-8")

          old_enum = "private enum class AppScreen { HOME, LIBRARY, FILES, FOLDERS, PLAYLISTS, SETTINGS, ACCOUNT, HIDDEN, TRASH, DIAGNOSTICS }"
          new_enum = "private enum class AppScreen { HOME, LIBRARY, DOWNLOADS, FILES, FOLDERS, PLAYLISTS, SETTINGS, ACCOUNT, HIDDEN, TRASH, DIAGNOSTICS }"
          assert old_enum in app or new_enum in app, "Enum AppScreen não encontrado"
          app = app.replace(old_enum, new_enum, 1)

          nav_marker = "                    NavigationBar {"
          if nav_marker in app:
              start = app.index(nav_marker)
              brace_start = app.index("{", start)
              depth = 0
              end = None
              for i in range(brace_start, len(app)):
                  if app[i] == "{":
                      depth += 1
                  elif app[i] == "}":
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              assert end is not None, "Fim do NavigationBar não encontrado"
              replacement = '''                    NerdoraOfficialBottomBar(
                        selectedRoute = screen.name,
                        onRoute = { route ->
                            val target = runCatching { AppScreen.valueOf(route) }.getOrDefault(AppScreen.HOME)
                            navigateTo(target)
                            if (target == AppScreen.LIBRARY) {
                                libraryOverride = null
                                libraryFavoritesOnly = false
                            }
                        }
                    )'''
              app = app[:start] + replacement + app[end:]

          if "onOpenDownloads = { navigateTo(AppScreen.DOWNLOADS) }" not in app:
              link_marker = '                    onOpenLink = { showOpenUrl = true }'
              assert link_marker in app, "Callback onOpenLink da Home não encontrado"
              extra_callbacks = '''                    onOpenFiles = { navigateTo(AppScreen.FILES) },
                    onOpenDownloads = { navigateTo(AppScreen.DOWNLOADS) },
                    onOpenSettings = { navigateTo(AppScreen.SETTINGS) },
              '''
              app = app.replace(link_marker, extra_callbacks + link_marker, 1)

          files_marker = "                AppScreen.FILES -> FilesScreen("
          files_replacement = "                AppScreen.FILES, AppScreen.DOWNLOADS -> FilesScreen("
          assert files_marker in app or files_replacement in app, "Rota FilesScreen não encontrada"
          app = app.replace(files_marker, files_replacement, 1)

          app_path.write_text(app, encoding="utf-8")
          PY

          sed -i -E 's/versionCode = [0-9]+/versionCode = 77/' extracted_project/app/build.gradle.kts
          sed -i -E 's/versionName = "[^"]+"/versionName = "0.9.17"/' extracted_project/app/build.gradle.kts

          grep -q 'versionName = "0.9.17"' extracted_project/app/build.gradle.kts
          grep -q 'Sua central de mídia e arquivos' extracted_project/app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          grep -q 'Categorias de arquivos' extracted_project/app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          grep -q 'Acesso rápido' extracted_project/app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          grep -q 'Reproduzidos recentemente' extracted_project/app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          grep -q 'NerdoraOfficialBottomBar' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'AppScreen.DOWNLOADS' extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          test -s extracted_project/app/src/main/java/com/nerdora/player/ui/NerdoraOfficialBottomBar.kt
          echo "v0.9.17: Home oficial Nerdora Player aplicada sobre a v0.9.16."

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Projeto: $PROJECT_DIR"

      - name: Identificar versão
        id: version
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          VERSION=$(grep -E 'versionName\s*=' app/build.gradle.kts | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ -n "$VERSION" ] || VERSION="dev"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versão: $VERSION"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restaurar e validar chave permanente
        id: signing
        shell: bash
        env:
          NERDORA_KEYSTORE_BASE64: ${{ secrets.NERDORA_KEYSTORE_BASE64 }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$NERDORA_KEYSTORE_BASE64"
          test -n "$NERDORA_KEYSTORE_PASSWORD"
          test -n "$NERDORA_KEY_ALIAS"
          test -n "$NERDORA_KEY_PASSWORD"

          KEYSTORE="$RUNNER_TEMP/nerdora-release.jks"
          printf '%s' "$NERDORA_KEYSTORE_BASE64" | tr -d '\r\n' | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list             -keystore "$KEYSTORE"             -storepass "$NERDORA_KEYSTORE_PASSWORD"             -alias "$NERDORA_KEY_ALIAS" >/dev/null

          echo "keystore_path=$KEYSTORE" >> "$GITHUB_OUTPUT"
          echo "Chave permanente restaurada e validada sem expor credenciais."

      - name: Preparar Android SDK
        shell: bash
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Validar Nerdora Player
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts
          grep -q 'versionName = "0.9.17"' app/build.gradle.kts
          test -f app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          test -f app/src/main/java/com/nerdora/player/DocumentOpenActivity.kt
          grep -q 'android:name=".DocumentOpenActivity"' app/src/main/AndroidManifest.xml
          grep -q 'MANAGE_EXTERNAL_STORAGE' app/src/main/AndroidManifest.xml
          grep -q 'ACTION_MANAGE_APP_ALL_FILES_ACCESS_PERMISSION' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'readXlsx' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'AppScreen.ACCOUNT' app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          grep -q 'UniversalFileIndexCache' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'SmallVideoAction' app/src/main/java/com/nerdora/player/ui/VideoPlayer.kt
          grep -q '"CYBER"' app/src/main/java/com/nerdora/player/ui/NerdoraTheme.kt
          grep -q 'settings.useWideViewPort = true' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'fun WordDocumentViewer' app/src/main/java/com/nerdora/player/ui/WordDocumentViewer.kt
          grep -q 'application/msword' app/src/main/AndroidManifest.xml
          grep -q 'Baixar e instalar' app/src/main/java/com/nerdora/player/ui/UpdateUi.kt
          grep -q 'updateDialogResult' app/src/main/java/com/nerdora/player/ui/SettingsScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/HighFidelityDocxViewer.kt
          test -s app/src/main/assets/docx_renderer/docx-renderer.umd.js
          test -s app/src/main/assets/docx_renderer/fonts/carlito-400.woff2
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          test -f app/src/main/java/com/nerdora/player/ui/HighFidelityXlsxViewer.kt
          test -s app/src/main/assets/xlsx_renderer/fortune-viewer.js
          test -s app/src/main/assets/xlsx_renderer/fortune-sheet.css
          test -s app/src/main/assets/xlsx_renderer/licenses/fortune-sheet-react-LICENSE.txt
          test -s app/src/main/assets/xlsx_renderer/licenses/fortune-excel-LICENSE.txt
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'scanQuickPublicFolders(root)' app/src/main/java/com/nerdora/player/ui/FilesScreen.kt
          grep -q 'fortune-sheet.css' app/src/main/assets/xlsx_renderer/viewer.html
          grep -q 'fortune-viewer.js' app/src/main/assets/xlsx_renderer/viewer.html
          test ! -e app/src/main/assets/xlsx_renderer/officekit-viewer.js
          test ! -e app/src/main/assets/xlsx_renderer/exceljs.min.js
          test ! -e app/src/main/assets/xlsx_renderer/luckyexcel.umd.js
          test ! -e app/src/main/assets/xlsx_renderer/luckysheet
          test -s app/src/main/java/com/nerdora/player/ui/NerdoraOfficialBottomBar.kt
          grep -q 'Sua central de mídia e arquivos' app/src/main/java/com/nerdora/player/ui/HomeScreen.kt
          grep -q 'AppScreen.DOWNLOADS' app/src/main/java/com/nerdora/player/ui/NerdoraPlayerApp.kt
          echo "Nerdora Player v0.9.17 validado."

      - name: Compilar APK Release assinado
        id: build
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        env:
          NERDORA_KEYSTORE_PATH: ${{ steps.signing.outputs.keystore_path }}
          NERDORA_KEYSTORE_PASSWORD: ${{ secrets.NERDORA_KEYSTORE_PASSWORD }}
          NERDORA_KEY_ALIAS: ${{ secrets.NERDORA_KEY_ALIAS }}
          NERDORA_KEY_PASSWORD: ${{ secrets.NERDORA_KEY_PASSWORD }}
        run: |
          set +e
          gradle --no-daemon :app:assembleRelease -PNERDORA_GITHUB_REPOSITORY="$GITHUB_REPOSITORY" --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Preparar e verificar APK assinado
        if: steps.build.outputs.status == '0'
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.android.outputs.project_dir }}"
          VERSION="${{ steps.version.outputs.version }}"
          APK=$(find "$PROJECT/app/build/outputs/apk/release" -type f -name '*.apk' | head -n 1)
          test -n "$APK"
          mkdir -p final-apk
          FINAL="final-apk/Nerdora-Player-v${VERSION}.apk"
          cp "$APK" "$FINAL"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$FINAL"

          sha256sum "$FINAL" | tee final-apk/SHA256SUMS.txt
          ls -lh final-apk/

      - name: Publicar APK
        if: steps.build.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v${{ steps.version.outputs.version }}
          path: |
            final-apk/*.apk
            final-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publicar Release pública v0.9.17 assinada
        if: steps.build.outputs.status == '0' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          APK="final-apk/Nerdora-Player-v${VERSION}.apk"
          TITLE="Nerdora Player v${VERSION} — Home Oficial"
          NOTES="Nerdora Player v0.9.17: estabelece a nova Home oficial inspirada no layout aprovado: identidade neon roxa, cartão de armazenamento real, quatro ações principais, grade de categorias com contagens do aparelho, acesso rápido às pastas, reproduzidos recentemente e nova navegação inferior com o N do Nerdora em destaque. Mantém todos os recursos anteriores da v0.9.16, incluindo o visualizador Excel com FortuneSheet, leitura de Word, cache de arquivos, conta e atualização interna."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" "$APK" --target "$GITHUB_SHA" --title "$TITLE" --notes "$NOTES"
          fi

      - name: Mostrar erro
        if: steps.build.outputs.status != '0'
        shell: bash
        run: |
          tail -n 220 nerdora-player-build.log
          exit 1
