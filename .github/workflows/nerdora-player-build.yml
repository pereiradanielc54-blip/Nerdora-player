          ! grep -q 'LuckyExcel.transformExcelToLucky' "$VIEWER"
          ! grep -q 'luckysheet.create' "$VIEWER"

          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("extracted_project/app/src/main/assets/xlsx_renderer/viewer.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script>([\s\S]*?)</script>', html)
          assert scripts, "Script inline XLSX v0.9.12 não encontrado"
          Path("/tmp/xlsx-v0912.js").write_text("\n".join(scripts), encoding="utf-8")

          # Garante que a expressão publicada é a versão segura sem barras duplicadas.
          assert 'const cellRegex = /<(?:[A-Za-z_][A-Za-z0-9_.-]*:)?c[^>]* r=' in html
          assert 'const mergeRegex = /<(?:[A-Za-z_][A-Za-z0-9_.-]*:)?mergeCell[^>]* ref=' in html
          assert '[\\\\w.-]*' not in html
          PY
          node --check /tmp/xlsx-v0912.js

          node <<'JS'
          function parseCellRef(ref) {
            const m = /^([A-Za-z]+)(\d+)$/.exec(ref || "");
            if (!m) return null;
            let col = 0;
            for (const ch of m[1].toUpperCase()) col = col * 26 + (ch.charCodeAt(0) - 64);
            return { row: Number(m[2]) - 1, col: col - 1 };
          }
          function unionBounds(a,b) {
            if (!a) return b ? {...b} : null;
            return {
              minRow: Math.min(a.minRow,b.minRow),
              minCol: Math.min(a.minCol,b.minCol),
              maxRow: Math.max(a.maxRow,b.maxRow),
              maxCol: Math.max(a.maxCol,b.maxCol)
            };
          }
          function bounds(xml) {
            let out = null;
            const re = /<(?:[A-Za-z_][A-Za-z0-9_.-]*:)?c[^>]* r=["']([A-Za-z]+[0-9]+)["']/g;
            let m, count = 0;
            while ((m = re.exec(xml)) !== null) {
              count++;
              const p = parseCellRef(m[1]);
              out = unionBounds(out,{minRow:p.row,maxRow:p.row,minCol:p.col,maxCol:p.col});
            }
            return {out,count};
          }
          const xml = '<x:worksheet><x:sheetData><x:row r="1"><x:c r="A1"/></x:row><x:row r="20"><x:c r="H20"/></x:row></x:sheetData></x:worksheet>';
          const result = bounds(xml);
          if (result.count !== 2 || result.out.maxRow !== 19 || result.out.maxCol !== 7) {
            console.error(result);
            process.exit(1);
          }
          console.log("Regressão A1:H20 validada:", result);
          JS

          test -s extracted_project/app/src/main/assets/docx_renderer/jszip.min.js
          grep -q 'DocumentKind.XLSX -> HighFidelityXlsxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          grep -q 'DocumentKind.DOCX -> HighFidelityDocxViewer' extracted_project/app/src/main/java/com/nerdora/player/ui/DocumentViewerScreen.kt
          echo "v0.9.12: parser visual da v0.9.10 restaurado e área estendida pelas referências reais do XML."

