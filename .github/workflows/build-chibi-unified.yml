name: Build Chibi Raiders unified HTML

on:
  push:
    branches:
      - chibi-raiders
    paths:
      - "chibi-raiders/index-5.1.1.html"
      - "chibi-raiders/styles-5.1.1.css"
      - "chibi-raiders/app-5.1.1.js"
      - "chibi-raiders/heroes/**"
      - ".github/workflows/build-chibi-unified.yml"

permissions:
  contents: write

jobs:
  build-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chibi-raiders

      - name: Assemble unified HTML
        shell: python
        run: |
          from pathlib import Path
          import re
          root=Path("chibi-raiders")
          html=(root/"index-5.1.1.html").read_text(encoding="utf-8")
          css=(root/"styles-5.1.1.css").read_text(encoding="utf-8")
          app=(root/"app-5.1.1.js").read_text(encoding="utf-8")
          html=html.replace('<link rel="stylesheet" href="./styles-5.1.1.css">',"<style>\n"+css+"\n</style>")
          pattern=re.compile(r'<script src="\./heroes/([^"]+)"></script>')
          def inline_hero(m):
              code=(root/"heroes"/m.group(1)).read_text(encoding="utf-8")
              return "<script>\n"+code+"\n</script>"
          html=pattern.sub(inline_hero,html)
          html=html.replace('<script src="./app-5.1.1.js"></script>',"<script>\n"+app+"\n</script>")
          (root/"unified-v5.1.1.html").write_text(html,encoding="utf-8")

      - name: Commit generated unified file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chibi-raiders/unified-v5.1.1.html
          git diff --cached --quiet || git commit -m "build: generate Chibi Raiders v5.1.1"
          git push origin HEAD:chibi-raiders
