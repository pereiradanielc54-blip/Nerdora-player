name: Build Chibi Raiders unified HTML

on:
  push:
    branches:
      - chibi-raiders
    paths:
      - "chibi-raiders/index-4.0.0.html"
      - "chibi-raiders/styles-4.0.0.css"
      - "chibi-raiders/app-4.0.0.js"
      - ".github/workflows/build-chibi-unified.yml"

permissions:
  contents: write

jobs:
  build-unified:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chibi-raiders

      - name: Assemble unified HTML
        shell: python
        run: |
          from pathlib import Path
          root = Path("chibi-raiders")
          html = (root / "index-4.0.0.html").read_text(encoding="utf-8")
          css = (root / "styles-4.0.0.css").read_text(encoding="utf-8")
          js = (root / "app-4.0.0.js").read_text(encoding="utf-8")
          html = html.replace(
              '<link rel="stylesheet" href="./styles-4.0.0.css">',
              "<style>\n" + css + "\n</style>",
          )
          html = html.replace(
              '<script src="./app-4.0.0.js"></script>',
              "<script>\n" + js + "\n</script>",
          )
          (root / "unified-v4.0.0.html").write_text(html, encoding="utf-8")

      - name: Commit generated unified file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add chibi-raiders/unified-v4.0.0.html
          git diff --cached --quiet || git commit -m "build: generate unified Chibi Raiders v4.0.0"
          git push origin HEAD:chibi-raiders
