name: Gerar APK Nerdora Player - SDK do GitHub

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Localizar ZIP do Nerdora Player
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "NerdoraPlayer-v0.2.0-CLEAN.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: NerdoraPlayer-v0.2.0-CLEAN.zip não encontrado na raiz do repositório."
            find . -maxdepth 2 -type f -print
            exit 1
          fi

          echo "ZIP encontrado: $ZIP_FILE"
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project
          echo "Projeto extraído."
          find extracted_project -maxdepth 3 -type f | sort | head -100

      - name: Encontrar raiz Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto Android: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # NÃO usa android-actions/setup-android.
      # Usa o Android SDK que já vem instalado no runner do GitHub.
      - name: Usar Android SDK pré-instalado do GitHub
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: Android SDK pré-instalado não encontrado em $ANDROID_HOME"
            exit 1
          fi

          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado dentro do SDK do GitHub."
            exit 1
          fi

          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verificar projeto antes da compilação
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          echo "Pasta do projeto:"
          pwd
          echo
          echo "Java:"
          java -version
          echo
          echo "Gradle:"
          gradle --version
          echo
          echo "Android SDK:"
          ls -la "$ANDROID_HOME/platforms/android-35" | head || true
          echo
          echo "Projeto:"
          grep -n "rootProject.name" settings.gradle.kts settings.gradle 2>/dev/null || true
          grep -n "applicationId" app/build.gradle.kts app/build.gradle 2>/dev/null || true

      - name: Compilar Nerdora Player diretamente
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          gradle --no-daemon :app:assembleDebug --stacktrace --console=plain

      - name: Localizar e preparar APK
        shell: bash
        run: |
          PROJECT="${{ steps.android.outputs.project_dir }}"
          APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            find "$PROJECT" -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p final-apk
          cp "$APK" "final-apk/Nerdora-Player-v0.2.0.apk"
          ls -lh final-apk/

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v0.2.0
          path: final-apk/Nerdora-Player-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
