name: Gerar APK Nerdora Player

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "NerdoraPlayer-v0.2.0-CLEAN.zip"
      - ".github/workflows/nerdora-player-from-zip.yml"

permissions:
  contents: read

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-24.04

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v7

      - name: Conferir arquivo do projeto
        shell: bash
        run: |
          if [ ! -f "NerdoraPlayer-v0.2.0-CLEAN.zip" ]; then
            echo "ERRO: NerdoraPlayer-v0.2.0-CLEAN.zip não foi encontrado na raiz do repositório."
            exit 1
          fi
          echo "ZIP correto encontrado."
          ls -lh NerdoraPlayer-v0.2.0-CLEAN.zip

      - name: Extrair Nerdora Player
        shell: bash
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q NerdoraPlayer-v0.2.0-CLEAN.zip -d build-source
          echo "Projeto extraído."

      - name: Encontrar e validar projeto Android
        id: project
        shell: bash
        run: |
          SETTINGS=$(find build-source -type f -name "settings.gradle.kts" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle.kts não encontrado dentro do ZIP."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "Projeto localizado em: $PROJECT_DIR"

          if ! grep -q 'rootProject.name = "NerdoraPlayer"' "$PROJECT_DIR/settings.gradle.kts"; then
            echo "ERRO: o ZIP não contém o projeto NerdoraPlayer esperado."
            echo "Conteúdo de settings.gradle.kts:"
            cat "$PROJECT_DIR/settings.gradle.kts"
            exit 1
          fi

          if ! grep -q 'applicationId = "com.nerdora.player"' "$PROJECT_DIR/app/build.gradle.kts"; then
            echo "ERRO: applicationId do Nerdora Player não foi encontrado."
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Validação concluída: este build é do Nerdora Player."

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Mostrar configuração
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: |
          echo "=== settings.gradle.kts ==="
          cat settings.gradle.kts
          echo "=== versões Android ==="
          grep -E 'compileSdk|targetSdk|versionCode|versionName|applicationId' app/build.gradle.kts
          echo "=== Java ==="
          java -version
          echo "=== Gradle ==="
          gradle --version

      - name: Compilar Nerdora Player
        working-directory: ${{ steps.project.outputs.project_dir }}
        shell: bash
        run: gradle :app:assembleDebug --stacktrace

      - name: Preparar APK
        shell: bash
        run: |
          PROJECT_DIR="${{ steps.project.outputs.project_dir }}"
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi criado no caminho esperado."
            find "$PROJECT_DIR" -type f -name "*.apk" -print || true
            exit 1
          fi

          mkdir -p final-apk
          cp "$APK" final-apk/Nerdora-Player-v0.2.0.apk
          ls -lh final-apk/Nerdora-Player-v0.2.0.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v7
        with:
          name: Nerdora-Player-v0.2.0
          path: final-apk/Nerdora-Player-v0.2.0.apk
          if-no-files-found: error
          retention-days: 30
