<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d111c"><title>Recuperar Nerdora Chibi Raiders</title><style>html,body{margin:0;min-height:100%;font-family:system-ui;background:#080b12;color:white}body{display:grid;place-items:center;padding:20px}.c{max-width:390px;text-align:center;background:#141a29;border:1px solid #3b4562;border-radius:24px;padding:26px}.n{width:70px;height:70px;margin:auto;display:grid;place-items:center;border-radius:20px;background:linear-gradient(145deg,#684cff,#ad79ff);font-size:36px;font-weight:900}.s{color:#aeb7cb;font-size:12px;margin-top:12px}.ok{color:#7fe5a4}</style></head><body><div class="c"><div class="n">N</div><h2>Recuperando atualização</h2><div id="s" class="s">Limpando apenas o cache antigo…</div></div><script>(async()=>{const s=document.getElementById("s");try{if("serviceWorker"in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(r=>r.unregister()))}if("caches"in window){const keys=await caches.keys();await Promise.all(keys.map(k=>caches.delete(k)))}s.className="s ok";s.textContent="Cache corrigido. Abrindo v0.9.1…";setTimeout(()=>location.replace("./index-0.9.1.html?recovered="+Date.now()),700)}catch(e){s.textContent="Abrindo versão corrigida…";setTimeout(()=>location.replace("./index-0.9.1.html?recovered="+Date.now()),900)}})();</script></body></html>
