name: Gerar APK Nerdora Player v0.2.2

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar Nerdora Player
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Encontrar ZIP
        id: zip
        shell: bash
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "NerdoraPlayer-v0.2.2-CORRIGIDO.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: NerdoraPlayer-v0.2.2-CORRIGIDO.zip não encontrado."
            find . -maxdepth 2 -type f -print
            exit 1
          fi
          echo "zip_file=$ZIP_FILE" >> "$GITHUB_OUTPUT"
          echo "ZIP encontrado: $ZIP_FILE"

      - name: Extrair projeto
        shell: bash
        run: |
          rm -rf extracted_project
          mkdir -p extracted_project
          unzip -q "${{ steps.zip.outputs.zip_file }}" -d extracted_project

      - name: Encontrar projeto Android
        id: android
        shell: bash
        run: |
          SETTINGS=$(find extracted_project \( -name "settings.gradle.kts" -o -name "settings.gradle" \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle(.kts) não encontrado."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Raiz Android: $PROJECT_DIR"
          grep -n "rootProject.name" "$PROJECT_DIR/settings.gradle.kts" "$PROJECT_DIR/settings.gradle" 2>/dev/null || true

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Igual ao método que funcionou no Nerdora Sync:
      # não usa android-actions/setup-android.
      - name: Usar SDK Android do GitHub
        shell: bash
        run: |
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERRO: SDK Android do runner não encontrado em $ANDROID_HOME"
            exit 1
          fi
          SDKMANAGER=$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "ERRO: sdkmanager não encontrado."
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Validar projeto correto
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          grep -q 'rootProject.name = "NerdoraPlayer"' settings.gradle.kts || {
            echo "ERRO: este ZIP não é o NerdoraPlayer."
            exit 1
          }
          grep -q 'applicationId = "com.nerdora.player"' app/build.gradle.kts || {
            echo "ERRO: applicationId incorreto."
            exit 1
          }
          echo "Projeto NerdoraPlayer validado."

      - name: Compilar e salvar log completo
        id: compile
        working-directory: ${{ steps.android.outputs.project_dir }}
        shell: bash
        run: |
          set +e
          gradle --no-daemon :app:assembleDebug --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/nerdora-player-build.log"
          STATUS=${PIPESTATUS[0]}
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Mostrar erro real da compilação
        if: steps.compile.outputs.status != '0'
        shell: bash
        run: |
          echo "## Erro real do Nerdora Player" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -Ei -B 4 -A 10 \
            '(^e: |error:|unresolved reference|compilation error|execution failed for task|what went wrong|a failure occurred|exception is:|caused by:)' \
            nerdora-player-build.log | head -n 160 | tee nerdora-player-errors.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo
          echo "========== ERRO REAL =========="
          cat nerdora-player-errors.txt 2>/dev/null || tail -n 120 nerdora-player-build.log
          echo "================================"
          exit 1

      - name: Preparar APK
        if: steps.compile.outputs.status == '0'
        shell: bash
        run: |
          PROJECT="${{ steps.android.outputs.project_dir }}"
          APK=$(find "$PROJECT/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "ERRO: compilação terminou sem APK."
            exit 1
          fi
          mkdir -p final-apk
          cp "$APK" "final-apk/Nerdora-Player-v0.2.2.apk"
          ls -lh final-apk/

      - name: Publicar APK
        if: steps.compile.outputs.status == '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-v0.2.2
          path: final-apk/Nerdora-Player-v0.2.2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar log de erro
        if: steps.compile.outputs.status != '0'
        uses: actions/upload-artifact@v4
        with:
          name: Nerdora-Player-LOG-ERRO
          path: |
            nerdora-player-build.log
            nerdora-player-errors.txt
          if-no-files-found: warn
          retention-days: 7
